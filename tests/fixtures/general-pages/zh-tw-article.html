  <article>
    <h1>繁體中文文章範例</h1>
    <p>這是一篇合成的繁體中文文章，用來測試一般網頁閱讀器是否能保留主要內容。文字不包含真實人物、真實帳號或私人網址，只描述一個公開討論流程。</p>
    <p>第二段說明團隊先整理背景資料，再標記需要查證的主張，最後把待確認的問題交給使用者決定是否開啟外部工具。這段文字協助測試摘要與後續提問的輸入品質。</p>
    <p>第三段補足足夠長度，讓抽取器可以回傳完整狀態，而不是誤判成短內容或空白頁面。它也確認繁體中文空白正規化不會破壞句子。</p>
    <p>最後一段描述驗收條件：抽取結果必須包含標題、來源名稱、主要文字與清楚的狀態，並且在測試失敗時讓開發者知道是哪一個契約被破壞。</p>
  </article>
