    <article>
      <h1>公共服務測試頁面</h1>
      <p>這個合成新聞頁面描述一項公共服務測試，內容完全由測試資料撰寫，沒有引用真實報導、真實人物或真實機構的文字。</p>
      <p>第二段說明服務櫃台、線上表單與回覆時程的假想安排。段落保留繁體中文標點與語氣，用來檢查 parser 是否能穩定處理中文頁面。</p>
      <p>最後一段補充後續觀察指標，例如回覆速度、說明清楚程度與使用者是否容易找到下一步。這些都是合成資訊，只用於公開測試。</p>
    </article>
  </main>
