<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title data-i18n="sidepanel.title">Truly 閱讀輔助</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    body {
      --truly-sidepanel-bg: #e9edf2;
      --truly-sidepanel-surface: #fff;
      --truly-sidepanel-subtle-surface: #f7f8fa;
      --truly-sidepanel-muted-surface: #f5f6f7;
      --truly-sidepanel-border: #d8dee7;
      --truly-sidepanel-soft-border: #cfd6df;
      --truly-sidepanel-control-border: #ccd0d5;
      --truly-sidepanel-text: #1c1e21;
      --truly-sidepanel-muted-text: #65676b;
      --truly-sidepanel-faint-text: #8a8d91;
      --truly-sidepanel-accent: #1877f2;
      --truly-status-ok: #146c43;
      --truly-status-warn: #8a6d1f;
      --truly-status-error: #b42318;
      --truly-type-caption: 11px;
      --truly-type-body: 12px;
      --truly-type-title: 14px;
      --truly-control-height: 32px;
      --truly-reading-loading-reserve: clamp(148px, 18vh, 164px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--truly-type-body);
      color: var(--truly-sidepanel-text);
      background: var(--truly-sidepanel-bg);
      overflow-y: auto;
      padding-bottom: 46px;
    }
    .banner-close {
      background: transparent;
      border: none;
      font-size: var(--truly-type-title);
      color: #65676b;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .banner-close:hover {
      background: rgba(0,0,0,0.06);
    }
    .sidepanel-toolbar {
      position: sticky;
      top: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 10px 5px;
      background: linear-gradient(
        to bottom,
        color-mix(in srgb, var(--truly-sidepanel-bg) 94%, var(--truly-sidepanel-surface)) 76%,
        color-mix(in srgb, var(--truly-sidepanel-bg) 0%, transparent)
      );
      border-bottom: 1px solid color-mix(in srgb, var(--truly-sidepanel-border) 56%, transparent);
    }
    .sidepanel-utility-bar {
      position: fixed;
      right: 10px;
      bottom: 8px;
      z-index: 12;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid color-mix(in srgb, var(--truly-sidepanel-control-border) 86%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--truly-sidepanel-bg) 88%, var(--truly-sidepanel-surface));
      box-shadow: 0 1px 5px rgba(0,0,0,0.12);
    }
    .sidepanel-utility-link,
    .sidepanel-utility-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: var(--truly-control-height);
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--truly-sidepanel-muted-text);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--truly-type-caption);
      font-weight: 700;
      line-height: 1.1;
      text-decoration: none;
    }
    .sidepanel-utility-link svg,
    .sidepanel-utility-btn svg {
      width: 14px;
      height: 14px;
      stroke-width: 2;
      flex: 0 0 auto;
    }
    .sidepanel-utility-link:hover,
    .sidepanel-utility-btn:hover {
      border-color: var(--truly-sidepanel-soft-border);
      background: var(--truly-sidepanel-muted-surface);
      color: var(--truly-sidepanel-text);
    }
    .sidepanel-utility-link:focus-visible,
    .sidepanel-utility-btn:focus-visible {
      outline: 2px solid var(--truly-sidepanel-accent);
      outline-offset: 2px;
    }
    .feed-container {
      padding: 4px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .feed-container[hidden] {
      display: none;
    }
    .tab-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 2px;
      width: 184px;
      min-height: calc(var(--truly-control-height) + 4px);
      padding: 2px;
      border: 1px solid var(--truly-sidepanel-control-border);
      border-radius: 999px;
      background: color-mix(in srgb, var(--truly-sidepanel-muted-surface) 72%, transparent);
      flex: 0 0 auto;
    }
    .tab {
      min-height: var(--truly-control-height);
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--truly-sidepanel-muted-text);
      font-family: inherit;
      font-size: var(--truly-type-caption);
      font-weight: 700;
      line-height: 1.1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .tab[aria-selected="true"] {
      background: color-mix(in srgb, var(--truly-sidepanel-accent) 14%, var(--truly-sidepanel-surface));
      color: var(--truly-sidepanel-accent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--truly-sidepanel-accent) 34%, transparent);
    }
    .tab:focus-visible {
      outline: 2px solid var(--truly-sidepanel-accent);
      outline-offset: 2px;
    }
    .tab[aria-disabled="true"] {
      background: transparent;
      color: color-mix(in srgb, var(--truly-sidepanel-faint-text) 66%, var(--truly-sidepanel-surface));
      cursor: not-allowed;
      box-shadow: none;
    }
    .tab[aria-disabled="true"]::before {
      content: "\2298";
      color: var(--truly-sidepanel-faint-text);
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
    }
    .page-container {
      gap: 8px;
    }
    .page-reader-card {
      background: var(--truly-sidepanel-surface);
      border: 1px solid var(--truly-sidepanel-soft-border);
      border-radius: 8px;
      box-shadow: none;
    }
    .page-reader-title-block h2 {
      margin: 0;
      color: var(--truly-sidepanel-text);
      letter-spacing: 0;
    }
    .page-reader-focus-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid var(--truly-sidepanel-soft-border);
      border-radius: 8px;
      background: var(--truly-sidepanel-muted-surface);
    }
    .page-reader-focus-panel.page-reader-focus-scope {
      display: grid;
      align-items: initial;
      justify-content: initial;
      gap: 10px;
      padding: 11px 12px;
    }
    .page-reader-focus-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .page-reader-focus-title {
      margin: 0 0 2px;
      color: var(--truly-sidepanel-text);
      font-size: var(--truly-type-body);
      font-weight: 700;
      line-height: 1.2;
    }
    .page-reader-focus-detail {
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      line-height: 1.35;
    }
    .page-reader-focus-panel[data-state="error"] .page-reader-focus-detail {
      color: var(--truly-status-error);
    }
    .page-reader-focus-meta {
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      line-height: 1.35;
    }
    .page-reader-focus-preview {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: var(--truly-sidepanel-text);
      font-size: var(--truly-type-body);
      line-height: 1.5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .page-reader-focus-text {
      min-width: 0;
    }
    .page-reader-focus-fulltext {
      margin-top: 4px;
      color: var(--truly-sidepanel-text);
      font-size: var(--truly-type-body);
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .page-reader-focus-advisory {
      margin: 0;
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      line-height: 1.45;
    }
    .page-reader-focus-error {
      margin: 0;
      color: var(--truly-status-error);
      font-size: var(--truly-type-caption);
      line-height: 1.45;
    }
    .page-reader-focus-analysis {
      padding-top: 1px;
      border-top: 1px solid var(--truly-sidepanel-soft-border);
    }
    .page-reader-focus-analysis .page-reader-analysis {
      margin-top: 10px;
      padding-right: 0;
      padding-left: 0;
    }
    .page-reader-focus-analysis .page-reader-analysis h3,
    .page-reader-focus-analysis .page-reader-analysis.is-overview h3 {
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      font-weight: 600;
      line-height: 1.35;
    }
    .page-reader-focus-tools {
      padding-top: 9px;
      border-top: 1px solid var(--truly-sidepanel-soft-border);
    }
    .page-reader-focus-tools .page-reader-card-tools {
      margin-top: 0;
    }
    .page-reader-title-block h2 {
      font-size: var(--truly-type-title);
      line-height: 1.35;
    }
    .page-reader-status,
    .page-reader-empty,
    .page-reader-error {
      padding: 7px 10px;
      border: 1px solid var(--truly-sidepanel-soft-border);
      border-radius: 8px;
      background: var(--truly-sidepanel-muted-surface);
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-body);
      line-height: 1.45;
    }
    .page-reader-empty-state {
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .page-reader-empty-state p {
      margin: 0;
    }
    .page-reader-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 5px 10px;
      padding: 2px 10px 4px;
      border-color: transparent;
      background: transparent;
    }
    .page-reader-status-main {
      display: flex;
      align-items: baseline;
      flex: 1 1 190px;
      gap: 8px;
      min-width: 0;
    }
    .page-reader-status-label {
      color: var(--truly-sidepanel-text);
      font-weight: 700;
      margin-bottom: 0;
      white-space: nowrap;
    }
    .page-reader-status-detail {
      min-width: 0;
    }
    .page-status-ready .page-reader-status-label {
      color: var(--truly-status-ok);
    }
    .page-reader-status.is-quiet-ready {
      padding: 0 10px;
      margin-top: -2px;
    }
    /* Without a session card the status is the whole pane content, so it
       keeps the Feed inset-card look instead of floating bare text. */
    .page-reader-status.is-standalone {
      padding: 7px 10px;
      border-color: var(--truly-sidepanel-soft-border);
      background: var(--truly-sidepanel-muted-surface);
    }
    .page-reader-status.is-quiet-ready .page-reader-status-detail {
      display: none;
    }
    .page-status-loading .page-reader-status-label,
    .page-status-stale .page-reader-status-label {
      color: var(--truly-status-warn);
    }
    .page-status-error .page-reader-status-label,
    .page-reader-error {
      color: var(--truly-status-error);
    }
    .page-status-loading,
    .page-status-stale,
    .page-status-error {
      padding: 7px 10px;
      border-color: var(--truly-sidepanel-soft-border);
      background: var(--truly-sidepanel-muted-surface);
    }
    .page-reader-card {
      padding: 11px 12px;
    }
    .page-reader-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 0;
      padding: 8px 9px;
      border-radius: 7px;
      background: var(--truly-sidepanel-muted-surface);
    }
    .page-reader-title-block {
      flex: 1 1 240px;
      min-width: 0;
    }
    .page-reader-card-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      flex: 0 0 auto;
      max-width: min(260px, 50%);
    }
    .page-reader-card-footer {
      margin-top: 11px;
      padding: 10px 2px 0;
      border-top: 1px solid var(--truly-sidepanel-soft-border);
    }
    .page-reader-external-tools-label {
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      font-weight: 700;
      line-height: 1.3;
    }
    .page-reader-external-tools-hint {
      margin-top: 4px;
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      line-height: 1.4;
    }
    .page-reader-context-details {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 3px solid var(--truly-sidepanel-soft-border);
    }
    .page-reader-loading-context {
      margin-top: 8px;
      padding-left: 10px;
      border-left: 3px solid var(--truly-sidepanel-soft-border);
    }
    .page-reader-loading-context > span {
      display: inline-flex;
      align-items: center;
      min-height: var(--truly-control-height);
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      font-weight: 700;
      opacity: 0.82;
    }
    .page-reader-loading-context > span::before {
      content: "";
      width: 0;
      height: 0;
      margin-right: 6px;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid currentColor;
    }
    .page-reader-supplemental-details {
      min-width: 0;
    }
    .page-reader-context-body,
    .page-reader-supplemental-body {
      display: grid;
      gap: 7px;
      margin-top: 4px;
    }
    .page-reader-card-tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 2px 6px;
      margin-top: 7px;
    }
    .page-reader-target-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: var(--truly-control-height);
      padding: 4px 8px;
      border: 1px solid color-mix(in srgb, var(--truly-sidepanel-accent) 38%, var(--truly-sidepanel-control-border));
      border-radius: 999px;
      background: color-mix(in srgb, var(--truly-sidepanel-accent) 9%, transparent);
      color: var(--truly-sidepanel-accent);
      cursor: pointer;
      font-family: inherit;
      font-size: var(--truly-type-caption);
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
    }
    .page-reader-target-action svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
      flex: 0 0 auto;
    }
    .page-reader-target-action:hover:not(:disabled) {
      border-color: color-mix(in srgb, var(--truly-sidepanel-accent) 58%, var(--truly-sidepanel-border));
      background: color-mix(in srgb, var(--truly-sidepanel-accent) 15%, var(--truly-sidepanel-surface));
    }
    .page-reader-target-action:disabled,
    .page-reader-target-action[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .page-reader-target-action:focus-visible {
      outline: 2px solid var(--truly-sidepanel-accent);
      outline-offset: 2px;
    }
    .page-reader-target-action.is-icon-only {
      width: 30px;
      min-width: 30px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--truly-sidepanel-muted-text);
    }
    .page-reader-target-action.is-icon-only:hover:not(:disabled) {
      border-color: var(--truly-sidepanel-soft-border);
      background: var(--truly-sidepanel-muted-surface);
      color: var(--truly-sidepanel-accent);
    }
    .page-reader-target-action.is-icon-only span {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 520px) {
      .page-reader-card-header {
        gap: 6px;
      }
    }
    .page-reader-url {
      margin-top: 3px;
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-reader-card-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 6px;
      margin-top: 3px;
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      line-height: 1.3;
    }
    .page-reader-card-meta > span {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-reader-card-meta > span + span::before {
      content: "·";
      margin-right: 6px;
      color: var(--truly-sidepanel-faint-text);
    }
    .page-reader-card-meta .page-reader-target-action.is-icon-only {
      width: 30px;
      min-width: 30px;
      min-height: 30px;
      margin: -4px 0 -4px auto;
    }
    .page-reader-card-meta .page-reader-target-action.is-icon-only svg {
      width: 13px;
      height: 13px;
    }
    .page-reader-target-action.is-reread-busy[aria-disabled="true"] {
      cursor: progress;
      opacity: 1;
      color: var(--truly-sidepanel-muted-text);
    }
    .page-reader-target-action.is-reread-busy svg {
      animation: truly-page-reread-spin 800ms linear infinite;
    }
    @keyframes truly-page-reread-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .page-reader-target-action.is-reread-busy svg {
        animation: none;
        opacity: 0.72;
      }
    }
    .page-reader-refresh-error {
      margin-top: 4px;
      color: var(--truly-status-error);
      font-size: var(--truly-type-caption);
      line-height: 1.35;
    }
    .page-reader-excerpt {
      color: var(--truly-sidepanel-text);
      font-size: var(--truly-type-body);
      line-height: 1.55;
      margin: 0 0 10px;
    }
    .page-reader-context-details > summary,
    .page-reader-supplemental-details > summary {
      display: inline-flex;
      align-items: center;
      width: 100%;
      box-sizing: border-box;
      min-height: var(--truly-control-height);
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      user-select: none;
    }
    .page-reader-context-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      margin-left: 6px;
      color: var(--truly-sidepanel-muted-text);
      flex: 0 0 auto;
    }
    .page-reader-context-indicator svg {
      width: 14px;
      height: 14px;
    }
    .page-reader-context-summary {
      padding: 8px 10px;
      border-radius: 7px;
      background: color-mix(in srgb, var(--truly-sidepanel-muted-text) 7%, transparent);
    }
    .page-reader-context-summary.is-caution {
      background: color-mix(in srgb, var(--truly-status-warn) 6%, transparent);
    }
    .page-reader-context-summary.is-action-required {
      background: color-mix(in srgb, var(--truly-status-error) 6%, transparent);
    }
    .page-reader-context-summary-status {
      margin-bottom: 3px;
      color: var(--truly-status-error);
      font-size: var(--truly-type-caption);
      font-weight: 700;
      line-height: 1.35;
    }
    .page-reader-context-summary p {
      margin: 0;
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-body);
      line-height: 1.5;
    }
    .page-reader-page-text {
      min-width: 0;
    }
    .page-reader-page-text .page-reader-excerpt {
      margin: 4px 0 0;
    }
    .page-reader-context-details > summary::-webkit-details-marker,
    .page-reader-supplemental-details > summary::-webkit-details-marker {
      display: none;
    }
    .page-reader-context-details > summary::before,
    .page-reader-supplemental-details > summary::before {
      content: "";
      width: 0;
      height: 0;
      margin-right: 6px;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 5px solid currentColor;
      transform-origin: 42% 50%;
      transition: transform 120ms ease;
    }
    .page-reader-context-details[open] > summary::before,
    .page-reader-supplemental-details[open] > summary::before {
      transform: rotate(90deg);
    }
    .page-reader-context-details > summary:focus-visible,
    .page-reader-supplemental-details > summary:focus-visible {
      outline: 2px solid var(--truly-sidepanel-accent);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .page-reader-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 0;
    }
    .page-reader-technical-details {
      margin: 0 0 9px;
    }
    .page-reader-technical-details .page-reader-meta {
      margin-top: 4px;
    }
    .page-reader-meta div {
      min-width: 0;
      padding: 6px 7px;
      border-radius: 6px;
      background: var(--truly-sidepanel-muted-surface);
    }
    .page-reader-meta dt {
      color: var(--truly-sidepanel-muted-text);
      font-size: var(--truly-type-caption);
      font-weight: 700;
    }
    .page-reader-meta dd {
      margin: 2px 0 0;
      color: var(--truly-sidepanel-text);
      font-size: var(--truly-type-caption);
      overflow-wrap: anywhere;
